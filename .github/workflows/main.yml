name: Execute classifier analysis
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/main.yml']
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: module://matplotlib_inline.backend_inline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'pandas<3' 'scikit-learn<1.8' nbconvert ipykernel
      - name: Load course dataset
        run: |
          curl --fail --location --retry 2 'https://mo-pcco.s3.us-east-1.amazonaws.com/BH-PCMLAI-R2-Master-EMCODE/module17/module17_starter.zip' -o /tmp/course.zip && unzip -oq /tmp/course.zip -d /tmp/course && find /tmp/course -name bank-additional-full.csv -exec cp {} . \; || echo 'Using notebook UCI fallback'
      - run: jupyter nbconvert --execute --to notebook --inplace --ExecutePreprocessor.timeout=1200 comparing_classifiers.ipynb
      - name: Publish measured results
        run: |
          cat README.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md comparing_classifiers.ipynb
          git commit -m 'Record executed notebook and measured campaign results'
          git push
